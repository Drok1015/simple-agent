<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP 调试台</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
        color: #1d293d;
        background: #eef2f7;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: #f4f7fb; }
      button, textarea { font: inherit; }
      button { cursor: pointer; }
      .shell { min-height: 100vh; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
      .sidebar {
        min-height: 100vh;
        padding: 22px 16px;
        color: #d8e5f4;
        background: radial-gradient(circle at 10% -5%, rgba(55, 132, 225, 0.4), transparent 18rem), linear-gradient(180deg, #101d31, #0a1525);
      }
      .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 22px; }
      .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; color: #fff; background: linear-gradient(145deg, #2c7df0, #46b9e8); font-weight: 750; }
      .brand strong { display: block; color: #f5f8fc; font-size: 14px; }
      .brand span { display: block; margin-top: 3px; color: #6f86a1; font-size: 9px; letter-spacing: 0.08em; }
      .back { height: 40px; padding: 0 11px; display: flex; align-items: center; gap: 9px; border: 1px solid rgba(145, 180, 218, 0.14); border-radius: 10px; color: #b8c8da; background: rgba(255,255,255,0.04); text-decoration: none; font-size: 11px; }
      .back:hover { color: #fff; background: rgba(255,255,255,0.08); }
      .side-label { margin: 24px 9px 8px; color: #637b97; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; }
      .tool-list { display: grid; gap: 6px; }
      .tool-item { width: 100%; padding: 10px; display: flex; align-items: center; gap: 9px; border: 0; border-radius: 10px; color: #a8bacf; background: transparent; text-align: left; }
      .tool-item:hover { background: rgba(255,255,255,0.05); }
      .tool-item.active { color: #f4f8fd; background: rgba(64, 139, 229, 0.17); }
      .tool-icon { width: 26px; height: 26px; flex: 0 0 26px; display: grid; place-items: center; border-radius: 8px; color: #78a9df; background: rgba(67,139,225,0.1); font-size: 11px; }
      .tool-copy { min-width: 0; }
      .tool-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .tool-desc { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #617995; font-size: 9px; }
      .side-foot { margin-top: 24px; padding: 12px; border: 1px solid rgba(145,180,218,0.1); border-radius: 12px; background: rgba(255,255,255,0.035); }
      .side-foot strong { display: block; color: #b4c4d6; font-size: 10px; }
      .side-foot span { display: block; margin-top: 6px; color: #607993; font-size: 9px; line-height: 1.6; overflow-wrap: anywhere; }
      .main { min-width: 0; }
      .topbar { height: 68px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; background: rgba(255,255,255,0.9); backdrop-filter: blur(14px); }
      .title h1 { margin: 0; color: #18263c; font-size: 15px; font-weight: 690; }
      .title p { margin: 4px 0 0; color: #8190a3; font-size: 10px; }
      .status { padding: 6px 10px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid #e5e9ef; border-radius: 999px; color: #6d7b8f; background: #fff; font-size: 10px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #f0a84d; box-shadow: 0 0 0 3px rgba(240,168,77,0.12); }
      .status.online { color: #34765f; border-color: #d8e9e2; background: #f6fbf9; }
      .status.online .dot { background: #34c58f; box-shadow: 0 0 0 3px rgba(52,197,143,0.12); }
      .status.error { color: #a74c4c; border-color: #f0dddd; background: #fff8f8; }
      .status.error .dot { background: #dc6565; box-shadow: 0 0 0 3px rgba(220,101,101,0.12); }
      .content { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0 40px; }
      .connection { padding: 17px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; border: 1px solid #dfe6ef; border-radius: 14px; background: #fff; box-shadow: 0 5px 18px rgba(28,48,76,0.035); }
      .eyebrow { color: #8b98a9; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
      .endpoint { margin-top: 7px; display: flex; align-items: center; gap: 8px; color: #31445f; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
      .protocol { padding: 3px 7px; border-radius: 999px; color: #2c75bd; background: #ebf4fd; font: 9px Inter, sans-serif; }
      .server-meta { margin-top: 7px; color: #8090a3; font-size: 10px; }
      .refresh { height: 34px; padding: 0 13px; border: 1px solid #cfdceb; border-radius: 9px; color: #386994; background: #f7fbff; font-size: 10px; }
      .refresh:disabled, .run:disabled { cursor: wait; opacity: 0.55; }
      .workbench { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 0.86fr); gap: 16px; }
      .panel { min-width: 0; border: 1px solid #dfe6ef; border-radius: 14px; background: #fff; box-shadow: 0 5px 18px rgba(28,48,76,0.03); overflow: hidden; }
      .panel-head { min-height: 60px; padding: 14px 17px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #edf0f4; }
      .panel-head h2 { margin: 0; color: #263750; font-size: 12px; font-weight: 680; }
      .panel-head p { margin: 4px 0 0; color: #8895a6; font-size: 9.5px; line-height: 1.5; }
      .badge { padding: 4px 7px; border-radius: 999px; color: #4c78a8; background: #eef5fc; font-size: 9px; }
      .panel-body { padding: 17px; }
      .empty { min-height: 300px; display: grid; place-items: center; color: #8795a7; text-align: center; font-size: 11px; line-height: 1.7; }
      .section-label { margin: 0 0 7px; color: #7d8b9d; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .schema { margin: 0 0 17px; max-height: 190px; padding: 12px; overflow: auto; border: 1px solid #e4e9ef; border-radius: 10px; color: #5f6f83; background: #f7f9fc; font: 9.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
      .args { width: 100%; min-height: 150px; padding: 12px; resize: vertical; border: 1px solid #dfe5ed; border-radius: 10px; outline: 0; color: #35445a; background: #fbfcfe; font: 10px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .args:focus { border-color: #85afd9; box-shadow: 0 0 0 3px rgba(73,137,202,0.09); }
      .run-row { margin-top: 11px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .hint { color: #8d99a8; font-size: 9px; }
      .run { height: 34px; padding: 0 15px; border: 0; border-radius: 9px; color: #fff; background: linear-gradient(145deg, #2b74cc, #2e91d2); box-shadow: 0 6px 14px rgba(40,113,194,0.18); font-size: 10px; }
      .result-box { min-height: 362px; margin: 0; padding: 15px; overflow: auto; color: #637287; background: #101b2b; font: 10px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      .result-box.idle { color: #75859c; }
      .result-box.error { color: #ffb7b7; }
      .latency { color: #8190a2; font-size: 9px; }
      @media (max-width: 860px) {
        .shell { grid-template-columns: 1fr; }
        .sidebar { min-height: auto; padding-bottom: 14px; }
        .tool-list, .side-label, .side-foot { display: none; }
        .brand { padding-bottom: 14px; }
        .main { min-height: 0; }
        .content { width: min(100% - 28px, 680px); }
        .workbench { grid-template-columns: 1fr; }
      }
      @media (max-width: 540px) {
        .topbar { padding: 0 15px; }
        .connection { grid-template-columns: 1fr; }
        .refresh { width: 100%; }
        .panel-head { align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div><strong>MCP 调试台</strong><span>PROTOCOL INSPECTOR</span></div>
        </div>
        <a class="back" href="/"><span>←</span><span>返回业务助手</span></a>
        <div class="side-label">远程工具</div>
        <div id="tool-list" class="tool-list"></div>
        <div class="side-foot">
          <strong>调试模式</strong>
          <span>每次操作都由本地服务建立独立 SSE 会话，不会把远程工具注册到业务 Agent。</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="title"><h1>MCP 调试台</h1><p>发现工具、检查 Schema 并执行原始调用</p></div>
          <div id="status" class="status"><span class="dot"></span><span id="status-text">正在连接</span></div>
        </header>

        <div class="content">
          <section class="connection">
            <div>
              <div class="eyebrow">Target endpoint</div>
              <div class="endpoint"><span id="endpoint">正在读取…</span><span class="protocol">SSE</span></div>
              <div id="server-meta" class="server-meta">等待服务握手</div>
            </div>
            <button id="refresh" class="refresh" type="button">重新连接</button>
          </section>

          <div class="workbench">
            <section class="panel">
              <div class="panel-head">
                <div><h2 id="tool-title">工具参数</h2><p id="tool-description">连接成功后选择一个远程工具</p></div>
                <span id="tool-count" class="badge">0 tools</span>
              </div>
              <div id="tool-editor" class="panel-body">
                <div class="empty">正在连接远程 MCP<br />并读取可用工具列表…</div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <div><h2>原始响应</h2><p>展示 MCP Tool Call 的完整返回结果</p></div>
                <span id="latency" class="latency">尚未调用</span>
              </div>
              <pre id="result" class="result-box idle">选择工具并填写参数后，点击“调用工具”。</pre>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script>
      const state = { tools: [], activeTool: null };
      const toolList = document.querySelector("#tool-list");
      const editor = document.querySelector("#tool-editor");
      const result = document.querySelector("#result");
      const status = document.querySelector("#status");
      const statusText = document.querySelector("#status-text");
      const refreshButton = document.querySelector("#refresh");

      function setStatus(kind, text) {
        status.className = `status ${kind || ""}`.trim();
        statusText.textContent = text;
      }

      function defaultValue(schema) {
        if (schema?.default !== undefined) return schema.default;
        if (schema?.type === "integer" || schema?.type === "number") return 0;
        if (schema?.type === "boolean") return false;
        if (schema?.type === "array") return [];
        if (schema?.type === "object") return {};
        return "";
      }

      function defaultArguments(schema) {
        const output = {};
        const required = new Set(schema?.required ?? []);
        for (const [name, property] of Object.entries(schema?.properties ?? {})) {
          if (required.has(name) || property.default !== undefined) output[name] = defaultValue(property);
        }
        return output;
      }

      function selectTool(tool) {
        state.activeTool = tool;
        document.querySelectorAll(".tool-item").forEach((item) => {
          item.classList.toggle("active", item.dataset.tool === tool.name);
        });
        document.querySelector("#tool-title").textContent = tool.name;
        document.querySelector("#tool-description").textContent = tool.description || "该工具没有提供描述";

        editor.innerHTML = `
          <div class="section-label">Input Schema</div>
          <pre class="schema"></pre>
          <div class="section-label">Arguments · JSON Object</div>
          <textarea id="arguments" class="args" spellcheck="false" aria-label="工具参数"></textarea>
          <div class="run-row">
            <span class="hint">参数会原样发送给远程 MCP</span>
            <button id="run" class="run" type="button">调用工具</button>
          </div>`;
        editor.querySelector(".schema").textContent = JSON.stringify(tool.inputSchema ?? {}, null, 2);
        editor.querySelector("#arguments").value = JSON.stringify(defaultArguments(tool.inputSchema), null, 2);
        editor.querySelector("#run").addEventListener("click", callActiveTool);
      }

      function renderTools(tools) {
        toolList.replaceChildren();
        document.querySelector("#tool-count").textContent = `${tools.length} tools`;
        tools.forEach((tool) => {
          const button = document.createElement("button");
          button.className = "tool-item";
          button.type = "button";
          button.dataset.tool = tool.name;
          const icon = document.createElement("span");
          icon.className = "tool-icon";
          icon.textContent = "ƒ";
          const copy = document.createElement("span");
          copy.className = "tool-copy";
          const name = document.createElement("span");
          name.className = "tool-name";
          name.textContent = tool.name;
          const desc = document.createElement("span");
          desc.className = "tool-desc";
          desc.textContent = tool.description || "无描述";
          copy.append(name, desc);
          button.append(icon, copy);
          button.addEventListener("click", () => selectTool(tool));
          toolList.appendChild(button);
        });
        if (tools[0]) selectTool(tools[0]);
        else editor.innerHTML = '<div class="empty">远程 MCP 没有返回可用工具。</div>';
      }

      async function connect() {
        refreshButton.disabled = true;
        setStatus("", "正在连接");
        document.querySelector("#server-meta").textContent = "正在进行 MCP 握手…";
        try {
          const response = await fetch("/api/mcp-debug");
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "连接失败");
          state.tools = data.tools ?? [];
          document.querySelector("#endpoint").textContent = data.target_url;
          document.querySelector("#server-meta").textContent = data.server
            ? `${data.server.name} · v${data.server.version}`
            : "服务已连接，未返回版本信息";
          renderTools(state.tools);
          setStatus("online", `已连接 · ${state.tools.length} 个工具`);
        } catch (error) {
          setStatus("error", "连接失败");
          editor.innerHTML = `<div class="empty"></div>`;
          editor.querySelector(".empty").textContent = error.message;
          result.className = "result-box error";
          result.textContent = error.message;
        } finally {
          refreshButton.disabled = false;
        }
      }

      async function callActiveTool() {
        if (!state.activeTool) return;
        const runButton = editor.querySelector("#run");
        let args;
        try {
          args = JSON.parse(editor.querySelector("#arguments").value || "{}");
          if (!args || Array.isArray(args) || typeof args !== "object") throw new Error("参数必须是 JSON 对象");
        } catch (error) {
          result.className = "result-box error";
          result.textContent = `参数解析失败：${error.message}`;
          return;
        }

        runButton.disabled = true;
        runButton.textContent = "调用中…";
        result.className = "result-box idle";
        result.textContent = `→ tools/call\n${JSON.stringify({ name: state.activeTool.name, arguments: args }, null, 2)}`;
        document.querySelector("#latency").textContent = "等待响应";
        try {
          const response = await fetch("/api/mcp-debug/call", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tool: state.activeTool.name, arguments: args }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "工具调用失败");
          result.className = "result-box";
          result.textContent = JSON.stringify(data, null, 2);
          document.querySelector("#latency").textContent = `${data.duration_ms} ms`;
        } catch (error) {
          result.className = "result-box error";
          result.textContent = error.message;
          document.querySelector("#latency").textContent = "调用失败";
        } finally {
          runButton.disabled = false;
          runButton.textContent = "调用工具";
        }
      }

      refreshButton.addEventListener("click", connect);
      connect();
    </script>
  </body>
</html>
