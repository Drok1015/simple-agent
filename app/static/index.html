<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>业务智能助手</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #eef2f7;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #eef2f7;
      }

      button, textarea { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }

      .app-shell {
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        overflow: hidden;
      }

      .sidebar {
        min-height: 0;
        padding: 20px 14px 16px;
        display: flex;
        flex-direction: column;
        color: #d8e5f4;
        background:
          radial-gradient(circle at 15% -10%, rgba(58, 135, 228, 0.4), transparent 19rem),
          linear-gradient(180deg, #101d31 0%, #0b1627 100%);
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }

      .brand {
        height: 44px;
        padding: 0 8px;
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .brand-mark,
      .assistant-avatar {
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(145deg, #2c7df0, #46b9e8);
        box-shadow: 0 8px 24px rgba(25, 119, 223, 0.25);
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        font-weight: 750;
        font-size: 15px;
      }

      .brand-name { color: #f6f9fd; font-size: 14px; font-weight: 650; }
      .brand-meta { margin-top: 2px; color: #7790ad; font-size: 10px; letter-spacing: 0.03em; }

      .new-chat {
        width: 100%;
        height: 42px;
        margin: 22px 0 18px;
        padding: 0 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid rgba(148, 180, 218, 0.18);
        border-radius: 11px;
        color: #e8f1fb;
        background: rgba(255, 255, 255, 0.06);
        cursor: pointer;
        transition: 160ms ease;
      }

      .new-chat:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(148, 180, 218, 0.35); }
      .new-chat span:last-child { color: #7890aa; font-size: 18px; font-weight: 300; }

      .nav-label {
        margin: 12px 10px 7px;
        color: #627a96;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .nav-item {
        width: 100%;
        min-height: 40px;
        padding: 0 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        border-radius: 10px;
        color: #9db0c6;
        background: transparent;
        text-align: left;
        cursor: default;
      }

      .nav-item.active { color: #f2f7fd; background: rgba(77, 143, 224, 0.14); }
      .nav-icon { width: 18px; text-align: center; color: #7f9bb9; }
      .nav-copy { min-width: 0; flex: 1; }
      .nav-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .nav-subtitle { display: block; margin-top: 2px; color: #617995; font-size: 10px; }

      .sidebar-bottom {
        margin-top: auto;
        padding: 12px;
        border: 1px solid rgba(145, 180, 218, 0.1);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.035);
      }

      .model-switcher { margin-bottom: 12px; }
      .model-switcher label { display: block; margin-bottom: 6px; color: #7f95af; font-size: 10px; font-weight: 650; }
      .model-control { display: flex; gap: 6px; }
      .model-control select {
        min-width: 0;
        height: 30px;
        flex: 1;
        padding: 0 8px;
        border: 1px solid rgba(148, 180, 218, 0.16);
        border-radius: 7px;
        outline: 0;
        color: #dce8f7;
        background: rgba(5, 14, 27, 0.45);
        font: inherit;
        font-size: 10px;
      }
      .model-control select:focus { border-color: rgba(72, 154, 242, 0.7); }
      .model-control button {
        height: 30px;
        padding: 0 9px;
        border: 1px solid rgba(73, 151, 237, 0.28);
        border-radius: 7px;
        color: #cfe2f8;
        background: rgba(44, 125, 240, 0.16);
        cursor: pointer;
        font-size: 10px;
      }
      .model-control button:disabled { cursor: wait; opacity: 0.55; }
      .model-status { min-height: 14px; margin-top: 5px; color: #60758e; font-size: 9px; }
      .model-status.error { color: #f0a4a4; }
      .health-line { display: flex; align-items: center; gap: 7px; color: #9cb0c7; font-size: 11px; }
      .health-dot { width: 7px; height: 7px; border-radius: 50%; background: #f6ad55; box-shadow: 0 0 0 3px rgba(246, 173, 85, 0.1); }
      .health-dot.online { background: #36c994; box-shadow: 0 0 0 3px rgba(54, 201, 148, 0.1); }
      .runtime-meta { margin-top: 8px; color: #60758e; font-size: 10px; line-height: 1.6; }

      .workspace {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: 68px minmax(0, 1fr) auto;
        background: #f8fafc;
      }

      .topbar {
        z-index: 3;
        padding: 0 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #e6eaf0;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(14px);
      }

      .agent-title { display: flex; align-items: center; gap: 11px; }
      .assistant-avatar { width: 34px; height: 34px; border-radius: 11px; font-size: 11px; font-weight: 750; }
      .title-copy h1 { margin: 0; color: #172033; font-size: 14px; font-weight: 680; }
      .title-copy p { margin: 3px 0 0; color: #7c899b; font-size: 10px; }

      .top-actions { display: flex; align-items: center; gap: 10px; }
      .status-pill {
        padding: 6px 9px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #dce8e4;
        border-radius: 999px;
        color: #397a65;
        background: #f3faf7;
        font-size: 10px;
      }

      .ghost-button {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid #e2e7ee;
        border-radius: 9px;
        color: #647287;
        background: #fff;
        cursor: pointer;
      }

      .mobile-new { display: none; }

      .messages {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        scroll-behavior: smooth;
      }

      .conversation {
        width: min(820px, calc(100% - 48px));
        min-height: 100%;
        margin: 0 auto;
        padding: 38px 0 32px;
        display: flex;
        flex-direction: column;
      }

      .welcome {
        width: 100%;
        margin: auto 0;
        padding: 28px 0 56px;
      }

      .welcome-mark {
        width: 46px;
        height: 46px;
        margin-bottom: 18px;
        display: grid;
        place-items: center;
        border: 1px solid #cfe0f5;
        border-radius: 15px;
        color: #236dc9;
        background: linear-gradient(145deg, #f3f8ff, #e7f2ff);
        box-shadow: 0 10px 30px rgba(36, 111, 205, 0.12);
        font-size: 21px;
      }

      .welcome h2 { margin: 0; color: #18243a; font-size: clamp(24px, 3vw, 32px); font-weight: 650; letter-spacing: -0.03em; }
      .welcome > p { max-width: 600px; margin: 12px 0 26px; color: #68758a; font-size: 13px; line-height: 1.75; }

      .starter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
      .starter {
        min-height: 148px;
        padding: 15px;
        border: 1px solid #e1e7ef;
        border-radius: 14px;
        color: #26354d;
        background: #fff;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(32, 50, 78, 0.025);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .starter:hover { transform: translateY(-2px); border-color: #b8d0ee; box-shadow: 0 10px 24px rgba(32, 70, 120, 0.08); }
      .starter span.starter-icon {
        width: 42px;
        height: 42px;
        margin-bottom: 15px;
        display: grid;
        place-items: center;
        border: 1px solid #cfe0f5;
        border-radius: 13px;
        color: #236dc9;
        background: linear-gradient(145deg, #f3f8ff, #e7f2ff);
        font-size: 24px;
        line-height: 1;
      }
      .starter strong { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 650; }
      .starter span { display: block; color: #7b8799; font-size: 10px; line-height: 1.5; }

      .message {
        width: 100%;
        margin: 0 0 30px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .message.user { justify-content: flex-end; }

      .message-avatar {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        color: #fff;
        background: linear-gradient(145deg, #2c7df0, #48b7e5);
        font-size: 9px;
        font-weight: 750;
      }

      .message-body { min-width: 0; max-width: calc(100% - 42px); flex: 1; }
      .message-name { margin: 0 0 8px; color: #556276; font-size: 10px; font-weight: 650; }

      .assistant-copy {
        color: #273449;
        font-size: 13px;
        line-height: 1.78;
        overflow-wrap: anywhere;
      }

      .assistant-copy > :first-child { margin-top: 0; }
      .assistant-copy > :last-child { margin-bottom: 0; }
      .assistant-copy p { margin: 0 0 12px; }
      .assistant-copy h1,
      .assistant-copy h2,
      .assistant-copy h3,
      .assistant-copy h4 {
        margin: 22px 0 10px;
        color: #18263c;
        line-height: 1.4;
        letter-spacing: -0.01em;
      }
      .assistant-copy h1 { font-size: 20px; }
      .assistant-copy h2 { padding-bottom: 6px; border-bottom: 1px solid #e7ebf1; font-size: 17px; }
      .assistant-copy h3 { font-size: 14px; }
      .assistant-copy h4 { font-size: 13px; }
      .assistant-copy strong { color: #17263d; font-weight: 700; }
      .assistant-copy em { color: #56677e; }
      .assistant-copy ul,
      .assistant-copy ol { margin: 8px 0 14px; padding-left: 24px; }
      .assistant-copy li { margin: 5px 0; padding-left: 2px; }
      .assistant-copy li::marker { color: #4f84c5; }
      .assistant-copy blockquote {
        margin: 14px 0;
        padding: 9px 13px;
        border-left: 3px solid #8db7e7;
        color: #607189;
        background: #f4f8fd;
      }
      .assistant-copy blockquote p { margin: 0; }
      .assistant-copy code {
        padding: 2px 5px;
        border: 1px solid #e1e7ef;
        border-radius: 5px;
        color: #b33e65;
        background: #f5f7fa;
        font: 0.9em/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .assistant-copy pre {
        margin: 14px 0;
        padding: 14px 16px;
        overflow-x: auto;
        border: 1px solid #27364a;
        border-radius: 11px;
        color: #dbe9f7;
        background: #152235;
      }
      .assistant-copy pre code { padding: 0; border: 0; color: inherit; background: transparent; font-size: 11px; }
      .assistant-copy table {
        width: 100%;
        margin: 14px 0;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border: 1px solid #dfe5ed;
        border-radius: 10px;
        font-size: 11px;
      }
      .assistant-copy th,
      .assistant-copy td { padding: 9px 11px; border-right: 1px solid #e6ebf1; border-bottom: 1px solid #e6ebf1; text-align: left; }
      .assistant-copy th { color: #40526a; background: #f2f6fa; font-weight: 650; }
      .assistant-copy tr:last-child td { border-bottom: 0; }
      .assistant-copy th:last-child,
      .assistant-copy td:last-child { border-right: 0; }
      .assistant-copy a { color: #216fc7; text-decoration: none; border-bottom: 1px solid rgba(33, 111, 199, 0.25); }
      .assistant-copy a:hover { border-bottom-color: currentColor; }
      .assistant-copy hr { margin: 20px 0; border: 0; border-top: 1px solid #e2e7ee; }
      .assistant-copy img { max-width: 100%; height: auto; border-radius: 10px; }

      .message.user .message-body {
        max-width: 78%;
        flex: 0 1 auto;
        padding: 11px 14px;
        border-radius: 15px 4px 15px 15px;
        color: #fff;
        background: linear-gradient(145deg, #256fc9, #2888d2);
        box-shadow: 0 7px 18px rgba(33, 109, 196, 0.15);
        font-size: 13px;
        line-height: 1.65;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .typing {
        height: 22px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .typing i { width: 5px; height: 5px; border-radius: 50%; background: #8da1b8; animation: pulse 1.2s infinite ease-in-out; }
      .typing i:nth-child(2) { animation-delay: 150ms; }
      .typing i:nth-child(3) { animation-delay: 300ms; }

      @keyframes pulse { 0%, 70%, 100% { opacity: 0.3; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }
      @keyframes spin { to { transform: rotate(360deg); } }

      .tool-stack { display: grid; gap: 8px; margin: 1px 0 13px; }
      .tool-run { overflow: hidden; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; }
      .tool-run summary { min-height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 9px; list-style: none; cursor: pointer; user-select: none; }
      .tool-run summary::-webkit-details-marker { display: none; }

      .tool-state-icon {
        width: 21px;
        height: 21px;
        flex: 0 0 21px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        color: #3679c9;
        background: #eef5fd;
        font-size: 10px;
        font-weight: 750;
      }

      .tool-run[data-status="started"] .tool-state-icon::before {
        content: "";
        width: 9px;
        height: 9px;
        border: 1.5px solid #a7c6e9;
        border-top-color: #2f78cb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .tool-run[data-status="finished"] .tool-state-icon { color: #23845f; background: #eaf8f2; }
      .tool-run[data-status="finished"] .tool-state-icon::before { content: "✓"; }
      .tool-run[data-status="error"] .tool-state-icon { color: #c34d4d; background: #fff0f0; }
      .tool-run[data-status="error"] .tool-state-icon::before { content: "!"; }
      .tool-title { min-width: 0; flex: 1; color: #3b485b; font-size: 11px; font-weight: 620; }
      .tool-status { color: #8a96a7; font-size: 10px; }
      .tool-chevron { color: #a0aaba; font-size: 10px; transition: transform 150ms ease; }
      .tool-run[open] .tool-chevron { transform: rotate(180deg); }
      .tool-content { padding: 0 12px 12px 42px; color: #6c7889; font-size: 10px; }
      .tool-input { margin: 0 0 9px; color: #8a95a5; overflow-wrap: anywhere; }

      .order-grid { display: grid; gap: 8px; }
      .order-card { padding: 12px; border: 1px solid #e5ebf2; border-radius: 10px; background: #fafcfe; }
      .order-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .order-id { color: #253a59; font-size: 11px; font-weight: 720; }
      .tag { padding: 3px 7px; border-radius: 999px; color: #286fae; background: #e9f3fb; font-size: 9px; }
      .order-meta { margin-top: 9px; display: grid; grid-template-columns: 1.3fr 1.2fr 0.8fr; gap: 9px; }
      .meta-item span { display: block; margin-bottom: 3px; color: #99a4b3; font-size: 8px; }
      .meta-item strong { color: #506078; font-size: 9px; font-weight: 550; }

      .draft-card { padding: 12px; border: 1px solid #dce8e4; border-radius: 10px; background: #f8fcfa; }
      .draft-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .draft-head strong { color: #285b4b; font-size: 11px; }
      .draft-fields { margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      .draft-field { padding: 8px 9px; border-radius: 8px; background: #fff; }
      .draft-field span { display: block; color: #97a49f; font-size: 8px; }
      .draft-field strong { display: block; margin-top: 3px; color: #435c54; font-size: 9px; font-weight: 560; overflow-wrap: anywhere; }
      .draft-warning { margin-top: 10px; padding-top: 9px; display: flex; align-items: center; gap: 6px; border-top: 1px solid #e2ece8; color: #788d85; }

      .concept-card { padding: 12px; border: 1px solid #dbe5f3; border-radius: 10px; background: #f7fafe; }
      .concept-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .concept-head strong { color: #25405f; font-size: 12px; }
      .concept-path { margin-top: 7px; color: #7d8ea3; font-size: 10px; letter-spacing: 0.02em; }
      .concept-desc { margin-top: 7px; color: #5a6a80; font-size: 10.5px; line-height: 1.6; }
      .concept-aliases { margin-top: 6px; color: #7d8ea3; font-size: 10px; }
      .concept-children { margin-top: 6px; color: #7d8ea3; font-size: 10px; }
      .asset-list { margin-top: 9px; display: grid; gap: 6px; }
      .asset { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; border: 1px solid #e5ebf2; border-radius: 8px; background: #fff; }
      .asset strong { color: #2c3d55; font-size: 10.5px; font-weight: 620; }

      .raw-result { margin: 0; max-height: 160px; overflow: auto; color: #647184; font: 9px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
      .tool-error { color: #b74b4b; }

      .message-actions { margin-top: 11px; display: flex; align-items: center; gap: 5px; opacity: 0; transition: opacity 150ms ease; }
      .message:hover .message-actions, .message-actions:focus-within { opacity: 1; }
      .mini-action { height: 27px; padding: 0 8px; border: 0; border-radius: 7px; color: #7d8898; background: transparent; cursor: pointer; font-size: 10px; }
      .mini-action:hover { color: #3a608e; background: #edf3f9; }

      .composer-area {
        z-index: 2;
        padding: 8px 28px 16px;
        background: linear-gradient(180deg, rgba(248, 250, 252, 0), #f8fafc 24%);
      }

      .composer-wrap { width: min(820px, 100%); margin: 0 auto; }
      .composer {
        padding: 9px 10px 8px 14px;
        border: 1px solid #dbe2eb;
        border-radius: 17px;
        background: #fff;
        box-shadow: 0 10px 35px rgba(33, 49, 74, 0.08), 0 1px 3px rgba(33, 49, 74, 0.04);
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .composer:focus-within { border-color: #9fc0e7; box-shadow: 0 12px 38px rgba(31, 92, 164, 0.1), 0 0 0 3px rgba(48, 120, 205, 0.06); }
      .composer-context { height: 22px; display: flex; align-items: center; gap: 6px; color: #68809b; font-size: 9px; }
      .context-chip { padding: 3px 7px; border-radius: 6px; color: #3872b2; background: #edf5fd; }

      textarea {
        width: 100%;
        min-height: 42px;
        max-height: 150px;
        padding: 7px 2px;
        resize: none;
        border: 0;
        outline: 0;
        color: #263247;
        background: transparent;
        font-size: 13px;
        line-height: 1.55;
      }

      textarea::placeholder { color: #9ba5b3; }
      .composer-footer { height: 34px; display: flex; align-items: center; justify-content: space-between; }
      .composer-hint { color: #a1aab7; font-size: 9px; }

      .send {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #276fca;
        cursor: pointer;
        box-shadow: 0 5px 13px rgba(39, 111, 202, 0.2);
      }

      .send:hover { background: #1e63b8; }
      .send:disabled { color: #aeb6c2; background: #edf0f4; box-shadow: none; cursor: not-allowed; }
      .send .stop-icon { display: none; width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
      .send.is-generating .send-icon { display: none; }
      .send.is-generating .stop-icon { display: block; }
      .disclaimer { margin: 8px 0 0; color: #9aa4b2; text-align: center; font-size: 9px; }

      @media (max-width: 900px) {
        .app-shell { grid-template-columns: 214px minmax(0, 1fr); }
        .starter-grid { grid-template-columns: 1fr; }
        .starter { min-height: 82px; }
      }

      @media (max-width: 700px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .workspace { grid-template-rows: 60px minmax(0, 1fr) auto; }
        .topbar { padding: 0 16px; }
        .status-pill { display: none; }
        .mobile-new { display: grid; }
        .conversation { width: min(100% - 28px, 820px); padding-top: 24px; }
        .welcome { padding-bottom: 20px; }
        .welcome > p { font-size: 12px; }
        .starter-grid { gap: 8px; }
        .message { margin-bottom: 24px; }
        .message.user .message-body { max-width: 88%; }
        .tool-content { padding-left: 12px; }
        .order-meta { grid-template-columns: 1fr 1fr; }
        .draft-fields { grid-template-columns: 1fr; }
        .composer-area { padding: 7px 12px 11px; }
        .composer-hint { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {

    <script src="/vendor/markdown-it.min.js"></script>
    <script>
      // ---------- 外部宿主（ham_ui iframe / URL 参数）注入 token ----------
      // 优先级：postMessage 实时注入 > URL ?token=（读取后立即清除）> sessionStorage 记忆
      const HAM_TOKEN_KEY = "ham_token";
      function isAllowedOrigin(origin) {
        if (/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(origin)) return true;
        if (/^https?:\/\/[\w-]+\.haier\.net$/.test(origin)) return true;
        return false;
      }
      (function setupTokenBridge() {
        const url = new URL(location.href);
        if (url.searchParams.has("token")) {
          const fromUrl = url.searchParams.get("token");
          if (fromUrl) sessionStorage.setItem(HAM_TOKEN_KEY, fromUrl);
          url.searchParams.delete("token");
          history.replaceState(null, "", url);
        }
        window.addEventListener("message", (event) => {
          if (!isAllowedOrigin(event.origin)) return;
          const data = event.data;
          if (data && typeof data === "object" && data.type === "ham-token" && typeof data.token === "string" && data.token) {
            sessionStorage.setItem(HAM_TOKEN_KEY, data.token);
          }
        });
      })();
      // 仅 iframe 嵌入时携带注入的 token；直接打开（顶层窗口）不带 header，
      // 后端回退读取 .env 的 HAM_TOKEN，保证本地/直开调试可用。
      function inIframe() {
        try {
          return window.self !== window.top;
        } catch {
          return true; // 跨域访问 window.top 会抛异常，按嵌入处理
        }
      }
      function hamTokenHeader() {
        if (!inIframe()) return {};
        const token = sessionStorage.getItem(HAM_TOKEN_KEY);
        return token ? { "X-HAM-Token": token } : {};
      }

      // crypto.randomUUID 仅在安全上下文（HTTPS/localhost）可用，HTTP 公网访问需降级方案
      function newThreadId() {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }
        return `t-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
      }
      let threadId = newThreadId();
      let activeAbortController = null;
      let hasMessages = false;
      let runtimeToolCount = 0;

      const messages = document.querySelector("#messages");
      const conversation = document.querySelector("#conversation");
      const input = document.querySelector("#input");
      const send = document.querySelector("#send");
      const form = document.querySelector("#chat-form");
      const modelPicker = document.querySelector("#model-picker");
      const switchModelButton = document.querySelector("#switch-model");
      const modelStatus = document.querySelector("#model-status");
      const markdown = window.markdownit({
        html: false,
        linkify: true,
        breaks: true,
      });

      function renderMarkdown(target, source) {
        target.innerHTML = markdown.render(source);
        target.querySelectorAll("a").forEach((link) => {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        });
      }

      const toolCatalog = {
        query_parent_projects: { label: "查询父项目", description: "调用资产中台真实接口查询父项目" },
        query_child_projects: { label: "查询子项目", description: "调用资产中台真实接口查询子项目" },
        query_purchase_requisitions: { label: "查询采购申请单", description: "调用资产中台真实接口查询采购申请" },
        query_purchase_contracts: { label: "查询采购合同", description: "调用资产中台真实接口查询采购合同" },
        query_assets_by_contract: { label: "查询合同资产", description: "按合同查询收货资产" },
        search_ontology: { label: "查询本体概念", description: "读取概念定义、分类链与工具映射" },
        add_ontology_concept: { label: "建设本体概念", description: "新增概念并挂到分类树下" },
        get_ontology: { label: "读取本体全图", description: "浏览资产项目/采购分类体系" },
        getNumberList: { label: "获取远程数字列表", description: "调用远程 MCP 返回固定数字列表" },
        square: { label: "计算数字平方", description: "调用远程 MCP 计算传入数字的平方" },
      };

      const fieldLabels = {};

      function updateThreadLabel() {
        document.querySelector("#thread-label").textContent = `会话 ${threadId.slice(0, 8)}`;
      }

      function renderWelcome() {
        conversation.innerHTML = `
          <div class="welcome" id="welcome">
            <div class="welcome-mark">✦</div>
            <h2>今天想查什么业务？</h2>
            <p>我接入了资产中台的真实接口，可以查询父项目、子项目、采购申请单、采购合同和合同资产。所有数据来自真实系统，只读不改。</p>
            <div class="starter-grid">
              <button class="starter" type="button" data-prompt="查一下生效状态的父项目">
                <span class="starter-icon">◈</span><strong>查生效的父项目</strong><span>真实接口 · 状态语义自动转码</span>
              </button>
              <button class="starter" type="button" data-prompt="查一下审批中的采购申请单">
                <span class="starter-icon">▤</span><strong>查审批中的采购单</strong><span>采购申请 · 供应商与金额</span>
              </button>
              <button class="starter" type="button" data-prompt="PR 是什么意思？查采购申请该用哪个工具？">
                <span class="starter-icon">◎</span><strong>本体概念查询</strong><span>术语归一 · 分类链 · 工具映射</span>
              </button>
              <button class="starter" type="button" data-prompt="帮我在本体里新增概念：设备类采购，父类是采购申请，映射到 query_purchase_requisitions 工具">
                <span class="starter-icon">＋</span><strong>会话中建设本体</strong><span>新增概念后立即影响工具选择</span>
              </button>
            </div>
          </div>`;

        conversation.querySelectorAll("[data-prompt]").forEach((button) => {
          button.addEventListener("click", () => {
            input.value = button.dataset.prompt;
            resizeInput();
            input.focus();
          });
        });
      }

      function startConversation(firstMessage) {
        if (hasMessages) return;
        hasMessages = true;
        conversation.innerHTML = "";
        document.querySelector("#conversation-title").textContent =
          firstMessage.length > 16 ? `${firstMessage.slice(0, 16)}…` : firstMessage;
      }

      function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
      }

      function formatValue(value) {
        if (typeof value === "number") return new Intl.NumberFormat("zh-CN").format(value);
        if (typeof value === "string") return value;
        return JSON.stringify(value);
      }

      /** 业务记录卡片配置：每个真实接口工具的标题字段、状态字段与展示字段。 */
      const recordViews = {
        query_parent_projects: {
          title: (row) => row.project_name || row.project_code || "未命名项目",
          id: (row) => row.project_code,
          meta: [
            ["状态", (row) => row.status ?? "—"],
            ["公司", (row) => row.org_code ?? "—"],
            ["预算", (row) => typeof row.budget_amount === "number" ? `¥${formatValue(row.budget_amount)}` : "—"],
            ["项目经理", (row) => row.manager ?? "—"],
          ],
        },
        query_child_projects: {
          title: (row) => row.project_name || row.project_code || "未命名子项目",
          id: (row) => row.project_code,
          meta: [
            ["状态", (row) => row.status ?? "—"],
            ["公司", (row) => row.org_code ?? "—"],
            ["预算", (row) => typeof row.budget_amount === "number" ? `¥${formatValue(row.budget_amount)}` : "—"],
            ["项目经理", (row) => row.manager ?? "—"],
          ],
        },
        query_purchase_requisitions: {
          title: (row) => row.requisition_name || row.requisition_code || "未命名采购单",
          id: (row) => row.requisition_code,
          meta: [
            ["状态", (row) => row.status ?? "—"],
            ["项目", (row) => row.project_name ?? row.project_code ?? "—"],
            ["供应商", (row) => row.supplier ?? "—"],
            ["金额", (row) => typeof row.amount === "number" ? `${row.currency ?? "¥"}${formatValue(row.amount)}` : "—"],
            ["申请人", (row) => row.applicant ?? "—"],
          ],
        },
      };

      function renderRecordList(container, toolName, output) {
        const view = recordViews[toolName];
        if (!view || !output || typeof output !== "object" || !Array.isArray(output.records)) {
          return false;
        }
        const grid = document.createElement("div");
        grid.className = "order-grid";

        if (output.records.length === 0) {
          grid.textContent = "接口没有返回匹配的数据";
        }

        output.records.forEach((row) => {
          const card = document.createElement("div");
          card.className = "order-card";
          const head = document.createElement("div");
          head.className = "order-card-head";
          const title = document.createElement("span");
          title.className = "order-id";
          title.textContent = `${view.title(row)}`;
          const statusTag = document.createElement("span");
          statusTag.className = "tag";
          statusTag.textContent = String(view.meta[0]?.[1](row) ?? "");
          head.append(title, statusTag);

          const meta = document.createElement("div");
          meta.className = "order-meta";
          view.meta.slice(1).forEach(([label, read]) => {
            const item = document.createElement("div");
            item.className = "meta-item";
            const labelSpan = document.createElement("span");
            labelSpan.textContent = label;
            const value = document.createElement("strong");
            value.textContent = String(read(row));
            item.append(labelSpan, value);
            meta.appendChild(item);
          });

          const idLine = document.createElement("div");
          idLine.className = "concept-path";
          idLine.textContent = `编码 ${view.id(row) ?? "—"}`;

          card.append(head, meta, idLine);
          grid.appendChild(card);
        });

        if (typeof output.total === "number" && output.total > output.records.length) {
          const more = document.createElement("div");
          more.className = "concept-path";
          more.textContent = `共 ${output.total} 条，当前显示前 ${output.records.length} 条，可让我翻页继续查`;
          grid.appendChild(more);
        }
        container.appendChild(grid);
        return true;
      }

      /** 合同/资产等未做专门卡片的记录：以关键值对形式列出。 */
      function renderGenericRecords(container, output) {
        if (!output || typeof output !== "object" || !Array.isArray(output.records)) return false;
        const grid = document.createElement("div");
        grid.className = "order-grid";
        if (output.records.length === 0) grid.textContent = "接口没有返回匹配的数据";
        output.records.forEach((row) => {
          const card = document.createElement("div");
          card.className = "order-card";
          const entries = Object.entries(row ?? {}).filter(
            ([key, value]) => typeof value !== "object" && value !== null && value !== "",
          );
          entries.slice(0, 6).forEach(([key, value]) => {
            const line = document.createElement("div");
            line.className = "meta-item";
            const label = document.createElement("span");
            label.textContent = key;
            const strong = document.createElement("strong");
            strong.textContent = formatValue(value);
            line.append(label, strong);
            card.appendChild(line);
          });
          grid.appendChild(card);
        });
        container.appendChild(grid);
        return true;
      }

      function conceptCard(concept) {
        const card = document.createElement("div");
        card.className = "concept-card";
        const head = document.createElement("div");
        head.className = "concept-head";
        const title = document.createElement("strong");
        title.textContent = concept.label;
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "本体概念";
        head.append(title, tag);

        const path = document.createElement("div");
        path.className = "concept-path";
        path.textContent = (concept.path ?? []).map((node) => node.label).join("  ›  ");

        const desc = document.createElement("div");
        desc.className = "concept-desc";
        desc.textContent = concept.description || "";

        card.append(head, path);
        if (concept.description) card.append(desc);

        const aliases = concept.aliases ?? [];
        if (aliases.length) {
          const aliasRow = document.createElement("div");
          aliasRow.className = "concept-aliases";
          aliasRow.textContent = `别名：${aliases.join("、")}`;
          card.append(aliasRow);
        }

        const children = concept.children ?? [];
        if (children.length) {
          const childRow = document.createElement("div");
          childRow.className = "concept-children";
          childRow.textContent = `子类：${children.map((child) => child.label).join("、")}`;
          card.append(childRow);
        }

        const instances = concept.instances ?? [];
        if (instances.length) {
          const list = document.createElement("div");
          list.className = "asset-list";
          instances.forEach((instance) => {
            const row = document.createElement("div");
            row.className = "asset";
            const name = document.createElement("strong");
            name.textContent = instance.label;
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = instance.order_id;
            row.append(name, tag);
            list.appendChild(row);
          });
          card.append(list);
        }

        const call = concept.suggested_call;
        if (call && call.tool) {
          const callRow = document.createElement("div");
          callRow.className = "concept-children";
          callRow.textContent =
            Object.keys(call.params ?? {}).length > 0
              ? `工具映射：${call.tool} · ${JSON.stringify(call.params)}`
              : `工具映射：${call.tool}`;
          card.append(callRow);
        }

        const relations = concept.relations ?? [];
        if (relations.length) {
          const relRow = document.createElement("div");
          relRow.className = "concept-aliases";
          relRow.textContent = `关联：${relations
            .map((relation) =>
              `${relation.inverse ? "←" : "→"}${relation.type}${relation.target_label}`,
            )
            .join("，")}`;
          card.append(relRow);
        }
        return card;
      }

      function renderOntologySearch(container, output) {
        if (!output || typeof output !== "object") return false;
        if (output.found && output.concept) {
          container.appendChild(conceptCard(output.concept));
          return true;
        }
        const miss = document.createElement("div");
        miss.className = "concept-card";
        miss.textContent = output.suggestions?.length
          ? `本体中没有找到该概念。可用概念：${output.suggestions.join("、")}`
          : "本体中没有找到该概念。";
        container.appendChild(miss);
        return true;
      }

      function renderAddConcept(container, output) {
        if (!output || typeof output !== "object") return false;
        if (output.created && output.concept) {
          const card = conceptCard(output.concept);
          const foot = document.createElement("div");
          foot.className = "concept-children";
          foot.textContent = `已写入 ${output.persisted_to}，后续语义查询立即生效`;
          card.append(foot);
          container.appendChild(card);
          return true;
        }
        if (typeof output.reason === "string") {
          const miss = document.createElement("div");
          miss.className = "concept-card";
          miss.textContent = `建设被拒绝：${output.reason}`;
          container.appendChild(miss);
          return true;
        }
        return false;
      }

      function renderToolOutput(container, name, output) {
        container.innerHTML = "";
        const rendered =
          (recordViews[name] && renderRecordList(container, name, output)) ||
          (["query_purchase_contracts", "query_assets_by_contract"].includes(name) &&
            renderGenericRecords(container, output)) ||
          (name === "search_ontology" && renderOntologySearch(container, output)) ||
          (name === "add_ontology_concept" && renderAddConcept(container, output));
        if (rendered) return;

        const raw = document.createElement("pre");
        raw.className = "raw-result";
        raw.textContent = typeof output === "string" ? output : JSON.stringify(output, null, 2);
        container.appendChild(raw);
      }

      function createToolRun(event) {
        const details = document.createElement("details");
        details.className = "tool-run";
        details.dataset.status = event.status;
        details.dataset.toolId = event.id;
        const catalog = toolCatalog[event.name] || { label: event.name || "调用业务工具", description: "正在处理业务数据" };
        details.innerHTML = `
          <summary>
            <span class="tool-state-icon"></span>
            <span class="tool-title"></span>
            <span class="tool-status">处理中</span>
            <span class="tool-chevron">⌄</span>
          </summary>
          <div class="tool-content">
            <div class="tool-input"></div>
            <div class="tool-output"></div>
          </div>`;
        details.querySelector(".tool-title").textContent = catalog.label;
        const inputLine = details.querySelector(".tool-input");
        inputLine.textContent = event.input
          ? `${catalog.description} · ${JSON.stringify(event.input)}`
          : catalog.description;
        return details;
      }

      function addMessage(role, text) {
        startConversation(text);
        const article = document.createElement("article");
        article.className = `message ${role}`;

        if (role === "user") {
          const body = document.createElement("div");
          body.className = "message-body";
          body.textContent = text;
          article.appendChild(body);
          conversation.appendChild(article);
          scrollToBottom();
          return null;
        }

        const avatar = document.createElement("div");
        avatar.className = "message-avatar";
        avatar.textContent = "AI";
        const body = document.createElement("div");
        body.className = "message-body";
        const name = document.createElement("div");
        name.className = "message-name";
        name.textContent = "业务助手";
        const toolStack = document.createElement("div");
        toolStack.className = "tool-stack";
        const copy = document.createElement("div");
        copy.className = "assistant-copy";
        const typing = document.createElement("span");
        typing.className = "typing";
        typing.innerHTML = "<i></i><i></i><i></i>";
        let sourceText = text;
        let renderFrame = 0;
        if (text) renderMarkdown(copy, sourceText);
        else copy.appendChild(typing);
        const actions = document.createElement("div");
        actions.className = "message-actions";
        const copyButton = document.createElement("button");
        copyButton.className = "mini-action";
        copyButton.type = "button";
        copyButton.textContent = "复制回答";
        copyButton.addEventListener("click", async () => {
          await navigator.clipboard.writeText(sourceText);
          copyButton.textContent = "已复制";
          setTimeout(() => { copyButton.textContent = "复制回答"; }, 1200);
        });
        actions.appendChild(copyButton);
        body.append(name, toolStack, copy, actions);
        article.append(avatar, body);
        conversation.appendChild(article);
        scrollToBottom();

        const toolNodes = new Map();
        let startedText = Boolean(text);

        const scheduleMarkdownRender = () => {
          if (renderFrame) return;
          renderFrame = requestAnimationFrame(() => {
            renderFrame = 0;
            renderMarkdown(copy, sourceText);
            scrollToBottom();
          });
        };

        return {
          appendText(value) {
            if (!startedText) {
              typing.remove();
              startedText = true;
            }
            sourceText += value;
            scheduleMarkdownRender();
          },
          setText(value) {
            typing.remove();
            startedText = true;
            sourceText = value;
            if (renderFrame) cancelAnimationFrame(renderFrame);
            renderFrame = 0;
            renderMarkdown(copy, sourceText);
          },
          upsertTool(event) {
            let tool = toolNodes.get(event.id);
            if (!tool) {
              tool = createToolRun(event);
              toolNodes.set(event.id, tool);
              toolStack.appendChild(tool);
            }
            tool.dataset.status = event.status;
            if (event.name) tool.dataset.toolName = event.name;
            const status = tool.querySelector(".tool-status");
            if (event.status === "started") status.textContent = "处理中";
            if (event.status === "finished") {
              status.textContent = "已完成";
              renderToolOutput(tool.querySelector(".tool-output"), event.name || tool.dataset.toolName, event.output);
            }
            if (event.status === "error") {
              status.textContent = "失败";
              const error = document.createElement("div");
              error.className = "tool-error";
              error.textContent = event.message || "工具调用失败";
              tool.querySelector(".tool-output").replaceChildren(error);
              tool.open = true;
            }
          },
          stop() {
            if (!startedText) this.setText("已停止生成。你可以修改问题后重新发送。");
          },
          getText() { return sourceText; },
        };
      }

      async function consumeEventStream(response, onEvent) {
        if (!response.body) throw new Error("浏览器不支持流式响应");
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value, { stream: !done }).replaceAll("\r\n", "\n");
          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) >= 0) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            if (!block || block.startsWith(":")) continue;
            let eventName = "message";
            const dataLines = [];
            for (const line of block.split("\n")) {
              if (line.startsWith("event:")) eventName = line.slice(6).trim();
              if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
            }
            if (dataLines.length) onEvent(eventName, JSON.parse(dataLines.join("\n")));
          }
          if (done) break;
        }
      }

      async function loadHealth() {
        try {
          const response = await fetch("/api/health");
          const data = await response.json();
          runtimeToolCount = data.mcp_tools.length;
          document.querySelector("#health-dot").classList.add("online");
          document.querySelector("#service").textContent = "服务运行正常";
          document.querySelector("#runtime-meta").textContent = `${data.model} · ${runtimeToolCount} 个业务工具`;
        } catch {
          document.querySelector("#service").textContent = "服务暂不可用";
          document.querySelector("#runtime-meta").textContent = "请检查本地服务状态";
        }
      }

      function renderModelOptions(models) {
        modelPicker.replaceChildren(...models.map((model) => {
          const option = document.createElement("option");
          option.value = model;
          option.textContent = model;
          return option;
        }));
      }

      async function loadModelConfig() {
        try {
          const response = await fetch("/api/config");
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "读取模型列表失败");
          renderModelOptions(data.models);
          modelPicker.value = data.model;
        } catch (error) {
          modelStatus.classList.add("error");
          modelStatus.textContent = error.message;
        }
      }

      async function switchModel() {
        const model = modelPicker.value.trim();
        modelStatus.classList.remove("error");
        if (!model) {
          modelStatus.classList.add("error");
          modelStatus.textContent = "请输入模型名称";
          return;
        }
        if (activeAbortController) {
          modelStatus.classList.add("error");
          modelStatus.textContent = "请先停止当前生成";
          return;
        }

        switchModelButton.disabled = true;
        modelStatus.textContent = "正在切换…";
        try {
          const response = await fetch("/api/config/model", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "模型切换失败");
          renderModelOptions(data.models);
          modelPicker.value = data.model;
          modelStatus.textContent = "已切换并记录";
          document.querySelector("#runtime-meta").textContent = `${data.model} · ${runtimeToolCount} 个业务工具`;
        } catch (error) {
          modelStatus.classList.add("error");
          modelStatus.textContent = error.message;
        } finally {
          switchModelButton.disabled = false;
        }
      }

      function resizeInput() {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
        send.disabled = !input.value.trim() && !activeAbortController;
      }

      function setGenerating(generating) {
        send.classList.toggle("is-generating", generating);
        send.disabled = !generating && !input.value.trim();
        send.setAttribute("aria-label", generating ? "停止生成" : "发送");
      }

      function newConversation() {
        if (activeAbortController) activeAbortController.abort();
        activeAbortController = null;
        threadId = newThreadId();
        hasMessages = false;
        document.querySelector("#conversation-title").textContent = "新的业务咨询";
        updateThreadLabel();
        renderWelcome();
        input.value = "";
        resizeInput();
        setGenerating(false);
        input.focus();
      }

      input.addEventListener("input", resizeInput);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      document.querySelector("#new-chat").addEventListener("click", newConversation);
      document.querySelector("#mobile-new").addEventListener("click", newConversation);
      switchModelButton.addEventListener("click", switchModel);
      modelPicker.addEventListener("keydown", (event) => {
        if (event.key === "Enter") switchModel();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (activeAbortController) {
          activeAbortController.abort();
          return;
        }

        const text = input.value.trim();
        if (!text) return;
        addMessage("user", text);
        input.value = "";
        input.style.height = "auto";
        const pending = addMessage("assistant", "");
        activeAbortController = new AbortController();
        setGenerating(true);
        let receivedToken = false;

        try {
          const response = await fetch("/api/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json", ...hamTokenHeader() },
            body: JSON.stringify({ message: text, thread_id: threadId }),
            signal: activeAbortController.signal,
          });

          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || "请求失败");
          }

          await consumeEventStream(response, (eventName, data) => {
            if (eventName === "token") {
              receivedToken = true;
              pending.appendText(data.delta);
            }
            if (eventName === "tool") pending.upsertTool(data);
            if (eventName === "done" && !receivedToken && data.answer) pending.setText(data.answer);
            if (eventName === "error") throw new Error(data.message || "流式请求失败");
            scrollToBottom();
          });

          if (!pending.getText().trim()) pending.setText("工具执行完成，但模型没有生成文字结论。你可以展开上方卡片查看业务结果。");
        } catch (error) {
          if (error.name === "AbortError") pending.stop();
          else pending.setText(`调用失败：${error.message}`);
        } finally {
          activeAbortController = null;
          setGenerating(false);
          input.focus();
          scrollToBottom();
        }
      });

      updateThreadLabel();
      renderWelcome();
      resizeInput();
      loadHealth();
      loadModelConfig();
    </script>
  </body>
</html>
